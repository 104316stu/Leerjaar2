<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <title>Experiment 2 - schilderijen</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="vlak plafond"></div>
  <div class="vlak achter"></div>
  <div class="vlak links"></div>
  <div class="vlak rechts"></div>
  <div class="vlak vloer"></div>

  <img class="schilderij a1" src="../../Fotos/martelkelder.jpg" alt="martelkelder"
       data-tekst="De martelkelder. Kettingen, boeien en een bank, onder witte gewelven.">
  <img class="schilderij a2" src="../../Fotos/portretkamer.jpg" alt="portretkamer"
       data-tekst="De kamer met het portret en een bedstee met groen fluweel.">
  <img class="schilderij l1" src="../../Fotos/zolder_rechtbank.jpg" alt="zolder"
       data-tekst="De zolder, met zware eiken balken en warme spots.">
  <img class="schilderij r1" src="../../Fotos/pijnbank.jpg" alt="pijnbank"
       data-tekst="De pijnbank. Verdachten werden hierop vastgebonden en verhoord.">

  <p class="uitleg">klik op een schilderij</p>

  <div id="groot">
    <img src="" alt="">
    <p></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
