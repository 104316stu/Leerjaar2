<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <title>Prototype - wand van stemmen</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="vlak plafond"></div>
  <div class="vlak achter"></div>
  <div class="vlak links"></div>

  <div class="vlak vloer"></div>

  <!-- de houten wand met namen op de achtermuur -->
  <div class="wand">
    <div class="naam" data-verhaal="Ik werd hier opgesloten omdat ik de prins zou willen vermoorden. Ik heb niets bekend, ook niet op de pijnbank.">
      Cornelis de Witt<span>1672</span>

    <div class="naam" data-verhaal="Hier komt een echt verhaal uit het archief van de Gevangenpoort.">
      gevangene 2<span>????</span>
    </div>
    <div class="naam" data-verhaal="Hier komt een echt verhaal uit het archief van de Gevangenpoort.">
      gevangene 3<span>????</span>
    </div>
    <div class="naam" data-verhaal="Hier komt een echt verhaal uit het archief van de Gevangenpoort.">
      gevangene 4<span>????</span>
    </div>
  </div>

  <p id="verhaal">ga naar een naam op de wand</p>

  <script src="script.js"></script>
</body>
</html>
