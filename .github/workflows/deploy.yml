name: Deploy to Plesk (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Pick up changes in linked repos even when nobody visits the main page.
  # Only changed files are uploaded, so a run without changes is cheap.
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Every "<folder>/<name>.git" file holds a GitHub URL. Clone that repo and
      # put its files in that folder, so the folder becomes a working page.
      # Linked repos are written as if they live at the site root, but here they
      # live in a subfolder. Root paths like url("/assets/x.png") or src="/img.png"
      # are rewritten to "/<folder>/assets/x.png" so images, css and js still load.
      - name: Pull linked repositories into their folders
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -e
          # use the token so private repos can be cloned too
          if [ -n "$GH_TOKEN" ]; then
            git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
          find . -path ./.git -prune -o -type f -name '*.git' -print | while read -r file; do
            dir=$(dirname "$file")
            url=$(tr -d '[:space:]' < "$file")
            case "$url" in
              https://github.com/*) ;;
              *) echo "skip $file: not a GitHub URL ($url)"; continue ;;
            esac
            echo "== $dir  <-  $url"
            tmp=$(mktemp -d)
            if git clone --depth 1 --quiet "$url" "$tmp"; then
              # images stored with Git LFS are only pointers until pulled
              if grep -qs 'filter=lfs' "$tmp/.gitattributes"; then
                git -C "$tmp" lfs pull || echo "::warning file=$file::lfs pull failed for $url"
              fi
              rm -rf "$tmp/.git" "$tmp/.github"
              prefix="/${dir#./}/"
              find "$tmp" -type f \( -name '*.css' -o -name '*.html' -o -name '*.htm' -o -name '*.php' -o -name '*.js' \) -print0 |
                xargs -0 -r sed -i -E \
                  -e "s#url\((['\"]?)/([^/'\"])#url(\1${prefix}\2#g" \
                  -e "s#(src|href|action|poster)=(['\"])/([^/'\"])#\1=\2${prefix}\3#g"
              cp -a "$tmp/." "$dir/"
            else
              echo "::warning file=$file::could not clone $url"
            fi
            rm -rf "$tmp"
          done

      - name: Fetch GitHub metadata (authenticated)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          mkdir -p cache
          echo '{}' > cache/github-data.json
          find . -path ./.git -prune -o -type f -name '*.git' -print | while read -r file; do
            url=$(tr -d '[:space:]' < "$file")
            case "$url" in https://github.com/*) ;; *) continue ;; esac
            slug=$(echo "$url" | sed -E 's#https://github.com/##; s#\.git$##; s#/$##' | tr 'A-Z' 'a-z')
            if repo=$(gh api "repos/$slug" 2>/dev/null); then :; else repo=null; fi
            if readme=$(gh api -H "Accept: application/vnd.github.html+json" "repos/$slug/readme" 2>/dev/null); then :; else readme=""; fi
            jq --arg k "$slug" --argjson r "$repo" --arg m "$readme" \
              '.[$k] = {repo: $r, readme: $m}' cache/github-data.json > /tmp/gd.json
            mv /tmp/gd.json cache/github-data.json
          done

      - name: Write server config from secret
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          DB_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          mkdir -p includes
          cat > includes/config.local.php <<EOF
          <?php
          return [
              'token' => '$GH_PAT',
              'repo'  => '$GITHUB_REPOSITORY',
              'file'  => 'deploy.yml',
              'ref'   => 'main',
              'db_password' => '$DB_PASSWORD',
          ];
          EOF

      - name: Sync changed files to httpdocs
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 145.118.2.73
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: httpdocs/
          state-name: .ftp-deploy-sync-state.json
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
